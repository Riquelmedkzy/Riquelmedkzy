name: Update Profile Cards

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    name: Generate local SVG cards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=Riquelmedkzy&show_icons=true&include_all_commits=true&hide_border=true&bg_color=0D1117&title_color=E7BD89&text_color=EDE3E9&icon_color=BA668F&ring_color=C18A77"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=Riquelmedkzy&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=E7BD89&text_color=EDE3E9"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution activity graph
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Riquelmedkzy
          cards: momentum
          output-dir: profile
          themes: light,dark
          palette: purple
          commit: false

      # This card requires cross-repository GitHub API access on some accounts.
      # If it fails, set a repository secret named PROFILE_STATS_TOKEN with
      # the documented public_repo/read:user scopes and re-run the workflow.
      # The initial trophy.svg is a non-misleading placeholder until then.
      - name: Generate trophy card
        id: trophies
        continue-on-error: true
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: "username=Riquelmedkzy&theme=onedark&no-frame=true&no-bg=true&column=4&margin-w=8"
          path: profile/trophy.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit and publish generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No SVG changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh GitHub profile cards [skip ci]"
          git push
